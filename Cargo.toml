[package]
name = "termtype"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Terminal-native adaptive touch typing tutor (port of keybr.com's learning engine)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.9", default-features = false, features = ["small_rng", "os_rng", "std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
toml = "1.1.7"
dirs = "7.0.0"
anyhow = "1.0.104"

[dev-dependencies]
tempfile = "3.27.0"
